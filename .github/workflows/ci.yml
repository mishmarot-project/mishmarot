name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: mishmarot_test
          POSTGRES_USER: mishmarot
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mishmarot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: postgres://mishmarot:test@localhost:5432/mishmarot_test
        run: psql "$DATABASE_URL" -f packages/db/migrations/0001_initial.sql

      - name: Run tests
        env:
          DATABASE_URL: postgres://mishmarot:test@localhost:5432/mishmarot_test
          REDIS_URL: redis://localhost:6379
        run: npm run test
