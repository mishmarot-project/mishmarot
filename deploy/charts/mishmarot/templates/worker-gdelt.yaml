{{- if .Values.workers.gdelt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mishmarot.fullname" . }}-worker-gdelt
  labels:
    {{- include "mishmarot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-gdelt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker-gdelt
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker-gdelt
    spec:
      containers:
        - name: worker
          image: "{{ .Values.workers.gdelt.image.repository }}:{{ .Values.workers.gdelt.image.tag }}"
          command: {{ .Values.workers.gdelt.command | toJson }}
          resources:
            {{- toYaml .Values.workers.gdelt.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "mishmarot.fullname" . }}-app-secrets
            - configMapRef:
                name: {{ include "mishmarot.fullname" . }}-app-config
{{- end }}
